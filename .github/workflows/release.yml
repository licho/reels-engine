# Creates the tag and GitHub release for the engine version after each merge to main.
# The version comes from pyproject.toml; if tag v<version> already exists, nothing happens.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          init=$(python3 -c 'import re; print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", open("reels_engine/__init__.py").read()).group(1))')
          if [ "$version" != "$init" ]; then
            echo "::error::pyproject.toml says $version but reels_engine/__init__.py says $init"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check tag
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        if: steps.check.outputs.exists == 'false'
        run: |
          # The entry for this version in the README "Versions" list (the bullet and its indented lines).
          awk -v tag="${{ steps.version.outputs.tag }}" '
            $0 ~ "^- \\*\\*" tag "\\*\\*" { on = 1; sub(/^- /, ""); print; next }
            on && /^  / { sub(/^  /, ""); print; next }
            on { exit }
          ' README.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Engine ${{ steps.version.outputs.tag }}." > notes.md
          fi
          cat notes.md

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file notes.md
