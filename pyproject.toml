[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reels-engine"
version = "0.10.0"
description = "Engine to produce vertical reels (1080x1920) with code: animation, captions, audio and automatic checks."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pillow", "numpy"]

[project.optional-dependencies]
audio = ["scipy"]

[tool.setuptools]
packages = ["reels_engine", "reels_engine.cartoon", "reels_engine.sketch"]
